<div class="fixed-bottom d-flex justify-content-center" style="bottom:var(--project-size-bar-offset)" role="region" aria-label="Cart"><div class="position-relative d-flex align-items-center gap-3 bg-primary text-white rounded-pill shadow ps-2 pe-2 py-2">
<span class="d-flex">{{#image1}}<img src="{{image1}}" alt="" class="rounded-circle border border-2 object-fit-cover" style="width:var(--project-size-thumb-sm);height:var(--project-size-thumb-sm);border-color:var(--project-surface-card)!important">{{/image1}}{{#image2}}<img src="{{image2}}" alt="" class="rounded-circle border border-2 object-fit-cover" style="width:var(--project-size-thumb-sm);height:var(--project-size-thumb-sm);border-color:var(--project-surface-card)!important;margin-left:calc(-1 * var(--project-size-thumb-overlap))">{{/image2}}{{#image3}}<img src="{{image3}}" alt="" class="rounded-circle border border-2 object-fit-cover" style="width:var(--project-size-thumb-sm);height:var(--project-size-thumb-sm);border-color:var(--project-surface-card)!important;margin-left:calc(-1 * var(--project-size-thumb-overlap))">{{/image3}}</span>
<span class="d-flex flex-column lh-sm"><span class="fw-bold fs-5">View cart</span><span class="small">{{summary}}</span></span>
<span class="d-flex align-items-center justify-content-center rounded-circle text-white" style="width:var(--project-size-chevron);height:var(--project-size-chevron);background-color:color-mix(in srgb,var(--bs-primary) 70%,var(--bs-black))"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
<div class="position-absolute top-0 start-0 w-100 h-100 d-grid opacity-0">{{> children}}</div>
</div></div>
