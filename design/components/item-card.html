<div class="card h-100 border-0 shadow-sm rounded overflow-hidden" style="min-width:9rem;background-color:var(--project-surface-card)"><div class="position-relative"><div class="ratio ratio-4x3 bg-body-secondary">{{#image}}<img src="{{image}}" alt="" class="object-fit-cover">{{/image}}</div><div class="position-absolute top-100 end-0 translate-middle-y me-2 rounded" style="background-color:var(--project-surface-card)">{{> children}}</div></div><div class="p-2 pt-4" style="width:0;min-width:100%"><div class="fw-bold fs-5">{{price}}</div><div class="fw-semibold lh-sm">{{name}}</div><div class="small text-body-secondary lh-sm">{{description}}</div></div></div>
