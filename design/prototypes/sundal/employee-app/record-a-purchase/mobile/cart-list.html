<!-- @prototypes design:surfaces/sundal/employee-app/record-a-purchase -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record a purchase · Cart · Mobile</title>
<style>
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #e9ecef; color: #212529; }
.prototype-bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; padding: .5rem 1rem; background: #212529; color: #f8f9fa; font-size: .875rem; }
.prototype-bar a { color: #f8f9fa; }
.prototype-bar__page { max-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 768px) { .prototype-bar__page { max-width: none; } }
.prototype-bar details { position: relative; }
.prototype-bar ul { position: absolute; z-index: 1; margin: .25rem 0 0; padding: .5rem 1rem; list-style: none; background: #212529; min-width: 14rem; }
.prototype-stage { flex: 1 1 auto; display: flex; justify-content: center; }
.prototype-stage--mobile, .prototype-stage--email { padding: 1rem; align-items: flex-start; }
.prototype-frame { border: 0; background: #fff; }
.prototype-frame--web { flex: 1 1 auto; width: 100%; }
.prototype-frame--sized { flex: none; }
.prototype-frame--mobile { border: .75rem solid #212529; border-radius: 2rem; }
.prototype-inbox { background: #fff; border: 1px solid #ced4da; }
.prototype-inbox header { padding: .75rem 1rem; border-bottom: 1px solid #ced4da; }
.prototype-frame--email { display: block; height: 80vh; }
</style>
</head>
<body>
<nav class="prototype-bar" aria-label="Prototype">
<span class="prototype-bar__page" title="Record a purchase">Record a purchase</span>
<strong>Cart</strong>
<span>Mobile</span>
<details>
<summary>Screens</summary>
<ul>
<li><a href="categories-list.html">Categories</a></li>
<li><a href="category-items-list.html">Category items</a></li>
<li><a href="cart-list.html" aria-current="page">Cart</a></li>
<li><a href="purchase-detail-detail.html">Purchase detail</a></li>
</ul>
</details>
</nav>
<div class="prototype-stage prototype-stage--mobile">
<iframe class="prototype-frame prototype-frame--mobile" style="width: 390px; height: 844px" sandbox="allow-scripts" src="screens/cart-list.html" title="Cart: Cart" data-prototype-screen></iframe></div>
<script>
(function () {
  var links = ["../purchase-detail-detail.html","../categories-list.html"];
  var frame = document.querySelector('[data-prototype-screen]');
  window.addEventListener('message', function (event) {
    var go = event.data && event.data.prototypeGo;
    if (event.source !== frame.contentWindow || typeof go !== 'string' || links.indexOf(go) === -1) return;
    location.assign(new URL(go, new URL(frame.getAttribute('src'), location.href)).href);
  });
})();
</script>
</body>
</html>
